[workspace]

[package]
name = "notch"
version = "0.1.0"
description = "notch — macOS notch + menu-bar surface for the OpenCode orchestration control plane"
edition = "2021"
rust-version = "1.85"
license = "MIT"

[lib]
name = "notch"
path = "src/lib.rs"

[[bin]]
name = "notch"
path = "src/main.rs"

[dependencies]
# Tauri v2 (macOS only). macos-private-api is required for a transparent
# undecorated window on macOS — see tauri.conf.json -> app.macOSPrivateApi.
tauri = { version = "2.12", features = ["macos-private-api", "image-png", "tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# AppKit reach-through for the notch NSWindow (level, collectionBehavior,
# styleMask) and NSScreen notch geometry. Isolated in macos.rs.
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSGeometry"] }
objc2-core-foundation = "0.3"
objc2-core-graphics = "0.3"
objc2-app-kit = { version = "0.3", default-features = false, features = [
  "std",
  "NSScreen",
  "NSWindow",
  "NSHapticFeedback",
  "NSImage",
  "NSImageRep",
  "NSBitmapImageRep",
  "libc",
  "NSFontDescriptor",
  "NSRunningApplication",
] }

# Agent A's crate — the real orchestrator. Started in-process as a background
# thread (reconcile + poll loop + subscriber flusher, mirroring `notchd serve`),
# with commands as thin wrappers. The socket layer is NOT used; the webview
# talks to the daemon through Tauri commands + events directly.
notchd = { path = "../../crates/notchd" }

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[profile.release]
lto = true
codegen-units = 1
